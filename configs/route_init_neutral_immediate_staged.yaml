route_initialization:
  mode: neutral
  logits: [0.0, 0.0, 0.0]
  induced_soft_probability: [0.3333333333, 0.3333333333, 0.3333333333]
  hard_route_quota: null
  case_specific_fraction: false
  evidence_prior_weight: 0.0

optimization:
  structural_activation_steps: 0
  route_schedule: staged
  route_warmup_steps: 1000
  temperature_start: 1.5
  temperature_final: 0.5
  temperature_anneal_steps: 4000
  uniform_exploration_weight: 0.0002

deployment:
  route_mode: hard
  projection: argmax_at_final_temperature
  compact_sidecar: true

rationale: >-
  Zero logits are the only valid differentiable representation of an
  unassigned common start: softmax probabilities must sum to one.  Route
  geometry is visible from the first optimization step so reconstruction can
  break symmetry.  Route-cost and commitment regularizers are delayed instead
  of suppressing the route-conditioned geometry itself.
