device: cuda
optimize_lr: 0.001
optimize_steps: 4000
color_loss_weight: 1.0
mask_loss_weight: 2.0
mask_balance_weight: 2.5
mask_boundary_weight: 0.50
mask_boundary_radius: 2

fiber_representation: residual_only
fiber_renderer: hairgs
fiber_capacity_mode: pixel_adaptive
fiber_min_points: 20000
fiber_max_points: 43662
fiber_target_pixels_per_point: 6.0
fiber_point_sampling_mode: spatial_morton
fiber_exact_vertex_binding: true
fiber_default_opacity: 0.5
fiber_default_opacity_reference_points: 20000
fiber_max_frames: 12
fiber_calibration_frames: 3
fiber_shell_samples: 2
fiber_strand_samples: 5

# Fine-tune the old residual checkpoint for perceptual sharpness while using
# that immutable checkpoint as the silhouette/non-regression teacher.
fiber_rgb_gradient_weight: 0.30
fiber_structured_spill_weight: 4.0
fiber_teacher_nonregression_weight: 5.0
fiber_teacher_nonregression_margin: 0.0
fiber_teacher_nonregression_every: 25
fiber_appearance_lr_scale: 1.0
fiber_geometry_lr_scale: 0.25
fiber_residual_drift_weight: 0.01
fiber_gradient_clip: 10.0
fiber_log_every: 100
fiber_checkpoint_every: 1000
fiber_ema_decay: 0.95
fiber_random_seed: 20260903
