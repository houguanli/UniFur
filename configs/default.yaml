device: cuda
optimize_lr: 0.0005
optimize_steps: 6000

color_loss_weight: 1.0
mask_loss_weight: 2.0
mask_balance_weight: 1.0
mask_boundary_weight: 0.5
mask_boundary_radius: 2

fiber_representation: unified
fiber_renderer: hairgs
fiber_capacity_mode: fixed
fiber_max_points: 180000
fiber_point_sampling_mode: spatial_morton
fiber_binding_mode: closest_surface
fiber_source_mask_mode: foreground
fiber_split_fixed_base: true
fiber_shell_samples: 2
fiber_strand_samples: 5
fiber_route_continuation: true
fiber_route_hardening: true
fiber_hard_route_policy: mass_preserving
fiber_log_every: 100
fiber_checkpoint_every: 1000
