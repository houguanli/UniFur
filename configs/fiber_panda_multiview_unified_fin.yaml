device: cuda
optimize_lr: 0.001
optimize_steps: 12000
color_loss_weight: 1.0
mask_loss_weight: 2.0
mask_balance_weight: 2.0
mask_boundary_weight: 0.30
mask_boundary_radius: 2

fiber_representation: unified
fiber_renderer: hairgs
fiber_max_points: 20000
fiber_binding_cache: /mnt/f/fur_hair_unified_data/benchmarks/neuralfur_panda_shared/fiber_binding_20k_cache.npz
fiber_max_frames: 28
fiber_calibration_frames: 4
fiber_shell_samples: 2
fiber_strand_samples: 5
fiber_warmup_steps: 2500
fiber_initial_temperature: 2.0
fiber_final_temperature: 0.35

# Fin-GS: shell samples are thin surface/fur-direction ribbons.  The soft
# grazing gate is the differentiable version of UnityFurURP's face/view test.
fiber_fin_gate_strength: 1.0
fiber_fin_grazing_threshold: 0.30
fiber_fin_grazing_softness: 0.06
fiber_fin_aspect_ratio: 6.0
fiber_fin_silhouette_weight: 0.10
fiber_fin_silhouette_radius: 3

fiber_appearance_lr_scale: 0.25
fiber_expert_appearance_weight: 0.001
fiber_geometry_lr_scale: 0.35
fiber_structure_activation_lr_scale: 5.0
fiber_route_lr_scale: 0.50
fiber_initialize_direction_from_normal: true
fiber_initial_shell_length_scale: 0.012
fiber_initial_strand_length_scale: 0.050
fiber_initial_residual_trust: 0.55
fiber_bootstrap_route_mass: [0.27, 0.03, 0.70]
fiber_gradient_clip: 10.0
fiber_log_every: 100
fiber_checkpoint_every: 2000
fiber_ema_decay: 0.95
fiber_route_continuation: true
fiber_route_hardening: true
fiber_hard_route_policy: mass_preserving

# Residual is a frozen photometric teacher.  Structural mass is earned only
# by positive held-out ablation damage; harmful routes pay a direct penalty.
fiber_freeze_residual_teacher: true
fiber_additive_teacher_mode: true
fiber_teacher_nonregression_weight: 5.0
fiber_teacher_nonregression_margin: 0.0
fiber_teacher_nonregression_every: 25
fiber_route_entropy_weight: 0.0002
fiber_route_neighbor_k: 8
fiber_route_neighbor_weight: 0.005
fiber_route_dropout_probability: 0.0
fiber_route_dropout_final_fraction: 0.0
fiber_route_dropout_residual_bias: 0.80
fiber_route_prior_weight: 0.010
fiber_route_prior_final_fraction: 0.05
fiber_route_minimum_mass: [0.02, 0.00, 0.20]
fiber_risk_calibration_every: 250
fiber_risk_calibration_start_geometry_blend: 0.80
fiber_risk_calibration_weight: 0.02
fiber_risk_calibration_ema: 0.8
fiber_risk_target_prior_blend: 0.05
fiber_risk_floor: 0.0001
fiber_negative_contribution_weight: 0.10

fiber_visual_hull_weight: 0.02
fiber_visual_hull_update_every: 500
fiber_visual_hull_min_views: 3
fiber_visual_hull_min_fraction: 0.25
fiber_visual_hull_margin_px: 3
fiber_random_seed: 20260820
fiber_shell_normal_weight: 0.01
fiber_shell_length_weight: 0.001
fiber_strand_thinness_weight: 0.01
fiber_height_weight: 0.001
fiber_bend_weight: 0.001
fiber_residual_drift_weight: 0.0
fiber_residual_trust_weight: 0.002

# Simulation-ready deformation ownership.  These weights do not force the
# photometric residual route to disappear; they assign each source Gaussian
# to a surface, shell or strand carrier and make the assignment local/smooth.
fiber_carrier_entropy_weight: 0.0005
fiber_carrier_prior_weight: 0.002
fiber_carrier_neighbor_weight: 0.002
fiber_carrier_tip_neighbor_weight: 0.001
fiber_carrier_attachment_weight: 0.005
fiber_carrier_tip_prior_weight: 0.002
fiber_carrier_family_alignment_weight: 0.02
fiber_carrier_structure_floor_weight: 0.02
