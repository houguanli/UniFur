device: cuda
optimize_lr: 0.001
optimize_steps: 20000
color_loss_weight: 1.0
mask_loss_weight: 2.0
mask_boundary_weight: 0.20
mask_boundary_radius: 1

# Dynamic MV4: same synchronized 4-view train and 8-view novel-camera test
# protocol as the residual bootstrap.  Residual parameters are transferred
# only as a photometric scaffold; routing is initialized independently.
fiber_representation: unified
fiber_renderer: hairgs
fiber_max_points: 20000
fiber_max_frames: 256
fiber_calibration_frames: 4
fiber_shell_samples: 2
fiber_strand_samples: 5
fiber_warmup_steps: 2000
fiber_initial_temperature: 2.0
fiber_final_temperature: 0.35
fiber_sigma_scale: 1.0
fiber_appearance_lr_scale: 0.25
fiber_geometry_lr_scale: 0.5
fiber_route_lr_scale: 1.0
fiber_initial_residual_trust: 0.20
fiber_bootstrap_route_mass: [0.45, 0.20, 0.35]
fiber_residual_trust_weight: 0.01
fiber_gradient_clip: 10.0
fiber_log_every: 100
fiber_checkpoint_every: 2000
fiber_ema_decay: 0.95
fiber_route_continuation: true
fiber_route_hardening: true
fiber_hard_route_policy: mass_preserving

# Expert handover: drop the residual on most structured updates so shell and
# strand must explain multi-view appearance, while a persistent mass prior
# keeps the learned final field from collapsing back to residual-only 3DGS.
fiber_route_entropy_weight: 0.0005
fiber_route_neighbor_k: 8
fiber_route_neighbor_weight: 0.01
fiber_route_dropout_probability: 0.60
fiber_route_dropout_residual_bias: 0.90
fiber_route_prior_weight: 0.08
fiber_route_prior_final_fraction: 0.60
fiber_random_seed: 20260813

# Route ablation is only reliable once structured geometry is fully visible.
# It remains a weak correction to the explicitly structural initialization.
fiber_risk_calibration_every: 500
fiber_risk_calibration_start_geometry_blend: 0.95
fiber_risk_calibration_weight: 0.002
fiber_risk_calibration_ema: 0.8
fiber_risk_target_prior_blend: 0.85
fiber_risk_floor: 0.0001

fiber_shell_normal_weight: 0.02
fiber_shell_length_weight: 0.001
fiber_strand_thinness_weight: 0.01
fiber_height_weight: 0.001
fiber_bend_weight: 0.001
fiber_residual_drift_weight: 0.01
