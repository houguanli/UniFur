device: cuda
optimize_lr: 0.001
optimize_steps: 20000
color_loss_weight: 1.0
mask_loss_weight: 2.0
mask_balance_weight: 2.0
mask_boundary_weight: 0.20
mask_boundary_radius: 1

# Panda 28-fit/8-test compromise model.  It bootstraps from the class-balanced
# residual fit, then exposes a deliberately moderate shell budget.  This keeps
# the low-background-opacity solution while testing whether explicit short-fur
# structure can be added without the foreground-PSNR loss of the aggressive
# shell configuration.
fiber_representation: unified
fiber_renderer: hairgs
fiber_max_points: 20000
fiber_max_frames: 28
fiber_calibration_frames: 4
fiber_shell_samples: 2
fiber_strand_samples: 5
fiber_warmup_steps: 4000
fiber_initial_temperature: 2.0
fiber_final_temperature: 0.35
fiber_sigma_scale: 1.0

fiber_appearance_lr_scale: 0.25
fiber_expert_appearance_weight: 0.001
fiber_geometry_lr_scale: 0.35
fiber_route_lr_scale: 0.50

fiber_initialize_direction_from_normal: true
fiber_initial_shell_length_scale: 0.012
fiber_initial_strand_length_scale: 0.050
fiber_initial_residual_trust: 0.55
fiber_bootstrap_route_mass: [0.27, 0.03, 0.70]
fiber_residual_trust_weight: 0.005
fiber_gradient_clip: 10.0
fiber_log_every: 100
fiber_checkpoint_every: 2000
fiber_ema_decay: 0.95
fiber_route_continuation: true
fiber_route_hardening: true
fiber_hard_route_policy: mass_preserving

fiber_route_entropy_weight: 0.0002
fiber_route_neighbor_k: 8
fiber_route_neighbor_weight: 0.005
fiber_route_dropout_probability: 0.30
fiber_route_dropout_final_fraction: 1.0
fiber_route_dropout_residual_bias: 0.80
fiber_route_prior_weight: 0.015
fiber_route_prior_final_fraction: 0.20
fiber_route_minimum_mass: [0.15, 0.01, 0.25]
fiber_random_seed: 20260818

fiber_risk_calibration_every: 500
fiber_risk_calibration_start_geometry_blend: 0.95
fiber_risk_calibration_weight: 0.005
fiber_risk_calibration_ema: 0.8
fiber_risk_target_prior_blend: 0.15
fiber_risk_floor: 0.0001

fiber_shell_normal_weight: 0.02
fiber_shell_length_weight: 0.001
fiber_strand_thinness_weight: 0.01
fiber_height_weight: 0.001
fiber_bend_weight: 0.001
fiber_residual_drift_weight: 0.01
