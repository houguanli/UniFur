device: cuda
optimize_lr: 0.001
optimize_steps: 20000
color_loss_weight: 1.0
mask_loss_weight: 10.0

# Official NeuralFur Panda protocol: fit 28 calibrated views and evaluate the
# eight views whose original camera index is divisible by five.
fiber_representation: residual_only
fiber_renderer: hairgs
fiber_max_points: 20000
fiber_max_frames: 28
fiber_calibration_frames: 0
fiber_shell_samples: 2
fiber_strand_samples: 5
fiber_sigma_scale: 1.0

fiber_appearance_lr_scale: 0.25
fiber_geometry_lr_scale: 0.5
fiber_gradient_clip: 10.0
fiber_log_every: 100
fiber_checkpoint_every: 2000
fiber_ema_decay: 0.95

fiber_route_neighbor_k: 0
fiber_route_neighbor_weight: 0.0
fiber_route_dropout_probability: 0.0
fiber_risk_calibration_every: 0
fiber_risk_calibration_weight: 0.0
fiber_route_entropy_weight: 0.0
fiber_route_prior_weight: 0.0
fiber_shell_normal_weight: 0.0
fiber_shell_length_weight: 0.0
fiber_strand_thinness_weight: 0.0
fiber_height_weight: 0.0
fiber_bend_weight: 0.0
fiber_residual_drift_weight: 0.01
