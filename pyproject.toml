[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unifur"
version = "0.5.1"
description = "Adaptive Shell/Fin/Strand topology compression for HairGS."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "OpenEXR==3.4.15",
  "torch==2.1.2",
  "torchmetrics==1.8.2",
  "opencv-python==4.11.0.86",
  "pillow==12.2.0",
  "plyfile==1.1.3",
  "scipy==1.11.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hairgs_hybrid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
